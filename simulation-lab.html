<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07110c"><title>PITCH 11 — 3D Simulation Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07110c;color:#f4f7f4;font-family:Inter,system-ui,Segoe UI,sans-serif;touch-action:none;user-select:none}
#app{position:fixed;inset:0;background:#07110c}#scene{position:absolute;inset:0}#scene canvas{display:block;width:100%;height:100%}
header{position:absolute;z-index:2;top:0;left:0;right:0;height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:linear-gradient(180deg,#06100de8,#06100d55);pointer-events:none}
.brand{font-size:18px;font-weight:950;font-style:italic;letter-spacing:.14em}.brand span{color:#d9b86c}.sub{font-size:9px;color:#b1c0b4;letter-spacing:.19em;margin-top:3px}
#scoreboard{display:flex;align-items:center;gap:13px;font-variant-numeric:tabular-nums}.team{font-size:10px;letter-spacing:.14em;color:#c6d2c8}.score{font-size:26px;font-weight:900;letter-spacing:.1em}.clock{font-size:12px;color:#f1d48a;min-width:46px;text-align:center}
#status{position:absolute;z-index:2;top:78px;left:50%;transform:translateX(-50%);padding:7px 13px;border:1px solid #ffffff35;border-radius:99px;background:#07130dbb;color:#e5eee7;font-size:10px;letter-spacing:.12em;white-space:nowrap;pointer-events:none}
#event{position:absolute;z-index:2;top:116px;left:50%;transform:translateX(-50%);font-weight:950;font-size:22px;letter-spacing:.12em;color:#f4d98d;text-shadow:0 2px 18px #000;pointer-events:none}
footer{position:absolute;z-index:2;bottom:0;left:0;right:0;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:linear-gradient(0deg,#06100df2,#06100d44);pointer-events:none}
#help{font-size:10px;color:#d0dbd2;line-height:1.5}#actions{display:flex;gap:8px;pointer-events:auto}
button{border:1px solid #ffffff45;background:linear-gradient(180deg,#243a2d,#102218);color:#f4f7f4;border-radius:11px;padding:11px 15px;font-weight:800;font-size:10px;letter-spacing:.1em;min-width:68px;touch-action:manipulation}
button.primary{border-color:#d9b86c;background:linear-gradient(180deg,#765f31,#44351c);color:#fff0c6}
#mobile{display:none;position:absolute;inset:0;pointer-events:none}
#stick{position:absolute;left:22px;bottom:24px;width:128px;height:128px;border-radius:50%;background:#07140ebc;border:1px solid #e2ece155;pointer-events:auto;touch-action:none}
#nub{position:absolute;left:39px;top:39px;width:48px;height:48px;border-radius:50%;background:linear-gradient(145deg,#e5eee5,#789783);border:1px solid #ffffffaa;box-shadow:0 4px 18px #000a}
#mobileActions{position:absolute;right:18px;bottom:22px;display:grid;grid-template-columns:repeat(2,66px);gap:9px;pointer-events:auto}
#mobileActions button{min-width:0;width:66px;height:54px;padding:3px;border-radius:50%;background:#09170fdc;border-color:#ffffff70;font-size:9px}
#mobileActions button.primary{background:linear-gradient(180deg,#765f31,#44351c)}
#rotate{display:none;position:absolute;z-index:5;inset:0;background:#07110c;color:#e8eee8;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:13px;letter-spacing:.1em}
@media(max-width:760px){header{height:52px;padding:0 12px}.brand{font-size:14px}.sub{font-size:7px}.score{font-size:20px}.team{font-size:8px}.clock{font-size:10px;min-width:35px}#status{top:61px;font-size:8px}#event{top:94px;font-size:16px}footer{height:48px;padding:0 12px}#help{font-size:8px}#actions{display:none}#mobile{display:block}}
@media(orientation:portrait) and (max-width:760px){#rotate{display:flex}header,footer,#status,#event,#mobile{visibility:hidden}}
</style></head><body><div id="app"><div id="scene"></div>
<header><div><div class="brand">PITCH <span>11</span></div><div class="sub">3D SIMULATION LAB · 11V11</div></div>
<div id="scoreboard"><span class="team">HOME</span><span class="score" id="score">0 — 0</span><span class="team">AWAY</span><span class="clock" id="clock">00:00</span></div></header>
<div id="status">INITIALISING MATCH ENGINE</div><div id="event"></div>
<div id="mobile"><div id="stick"><div id="nub"></div></div><div id="mobileActions"><button data-action="pass">PASS</button><button data-action="shoot" class="primary">SHOOT</button><button data-action="switch">SWITCH</button><button data-action="tackle">TACKLE</button><button id="sprint">SPRINT</button><button data-action="restart">PLAY</button></div></div>
<footer><div id="help">WASD MOVE · SHIFT SPRINT · P PASS · SPACE SHOOT · E SWITCH · Q TACKLE · ESC PAUSE</div><div id="actions"><button data-action="pass">PASS · P</button><button data-action="shoot" class="primary">SHOOT · SPACE</button><button data-action="switch">SWITCH · E</button><button data-action="tackle">TACKLE · Q</button><button data-action="restart">RESTART</button><button data-action="pause">PAUSE</button></div></footer>
<div id="rotate">ROTATE YOUR DEVICE TO LANDSCAPE<br><br>PITCH 11 IS DESIGNED FOR LANDSCAPE GAMEPLAY</div></div>
<script type="module" src="./engine/simulation-lab.mjs"></script></body></html>
