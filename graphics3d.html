<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07110c">
<title>PITCH 11 — Stadium Graphics 2.6</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07110c;color:#f4f7f4}#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
.hud{position:fixed;z-index:3;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;padding:clamp(12px,2.2vw,28px);pointer-events:none;gap:12px}
.brand{display:flex;flex-direction:column;gap:4px;text-shadow:0 2px 14px #000}.brand strong{font-size:clamp(13px,1.7vw,20px);letter-spacing:.16em;font-weight:900}.brand span{font-size:10px;letter-spacing:.2em;color:#a5d9a9}
.controls{display:flex;gap:7px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
button{border:1px solid #ffffff35;background:#07130dcc;color:#f4f7f4;padding:10px 13px;border-radius:9px;font:700 11px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.08em;cursor:pointer;backdrop-filter:blur(12px)}
button.active{border-color:#a3e635;color:#d8ff93;background:#21351acc}
#status{position:fixed;z-index:3;left:50%;bottom:18px;transform:translateX(-50%);padding:8px 12px;border:1px solid #ffffff22;border-radius:99px;background:#07130dbb;color:#d2dfd3;font-size:10px;letter-spacing:.08em;white-space:nowrap;backdrop-filter:blur(12px)}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#07110c;z-index:5;color:#d9f3d5;font-size:12px;letter-spacing:.16em}
#loading small{display:block;margin-top:10px;color:#819884;text-align:center;letter-spacing:.05em}
#drone-hud{position:fixed;z-index:4;left:16px;bottom:18px;display:none;align-items:flex-end;gap:12px;pointer-events:none}
#drone-hud.visible{display:flex}.drone-pad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px);gap:4px;pointer-events:auto}
.drone-pad button,.drone-alt button{padding:0;width:42px;height:42px;font-size:17px;border-radius:10px;touch-action:none}
.drone-pad button[data-move="forward"]{grid-column:2;grid-row:1}.drone-pad button[data-move="left"]{grid-column:1;grid-row:2}.drone-pad button[data-move="back"]{grid-column:2;grid-row:3}.drone-pad button[data-move="right"]{grid-column:3;grid-row:2}
.drone-alt{display:flex;flex-direction:column;gap:5px;pointer-events:auto}
#drone-help{position:fixed;z-index:4;right:16px;bottom:18px;display:none;max-width:230px;padding:10px 12px;border:1px solid #ffffff30;border-radius:10px;background:#07130dcc;color:#e8eee8;font-size:10px;line-height:1.5;pointer-events:none}
#drone-help.visible{display:block}
@media(max-width:600px){#drone-hud{left:10px;bottom:12px;gap:7px}.drone-pad{grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px)}.drone-pad button,.drone-alt button{width:38px;height:38px}#drone-help{right:9px;bottom:12px;max-width:145px;font-size:9px}.controls{max-width:70vw}}
@media(max-width:600px){.hud{align-items:flex-start}.controls{max-width:58vw}button{padding:9px 10px;font-size:9px}#status{bottom:10px;font-size:9px}}
</style></head><body>
<div id="stage"></div><div class="hud"><div class="brand"><strong>PITCH 11</strong><span>GRAPHICS 2.6 · STADIUM GEOMETRY FIX</span></div>
<div class="controls"><button class="active" data-view="broadcast">BROADCAST</button><button data-view="tactical">TACTICAL</button><button data-view="low">LOW STADIUM</button><button data-view="drone">DRONE CAM · DEV</button><button id="back">BACK TO GAME</button></div></div>
<div id="status">MATCHDAY ENVIRONMENT 2.6 · STADIUM ALIGNMENT</div>
<div id="drone-hud"><div class="drone-pad"><button data-move="forward" aria-label="Move forward">▲</button><button data-move="left" aria-label="Move left">◀</button><button data-move="back" aria-label="Move backward">▼</button><button data-move="right" aria-label="Move right">▶</button></div><div class="drone-alt"><button data-move="up" aria-label="Rise">＋</button><button data-move="down" aria-label="Descend">−</button></div></div><div id="drone-help">DEVELOPER CAMERA ONLY<br>WASD / arrows: move · Q/E: altitude<br>Drag: look around · Wheel: zoom<br>Mobile: use directional controls</div><div id="loading">BUILDING 3D STADIUM<small>Loading WebGL scene…</small></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script>
function show3DError(message){const panel=document.querySelector("#loading");if(!panel)return;panel.style.display="grid";panel.style.padding="28px";panel.style.textAlign="center";panel.style.lineHeight="1.6";panel.innerHTML="<div><strong style=\"color:#ffb4a8\">3D SCENE COULD NOT START</strong><small style=\"display:block;max-width:560px;margin:12px auto;color:#d5dcd5\"></small><button onclick=\"location.reload()\">RETRY</button><small style=\"display:block;margin-top:12px\">If this repeats, check WebGL and the network connection.</small></div>";panel.querySelector("small").textContent=message;}
window.addEventListener("error",event=>show3DError(event.message||"A script or WebGL error occurred."));
window.addEventListener("unhandledrejection",event=>show3DError(event.reason?.message||String(event.reason||"A module failed to load.")));
</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';

const host=document.querySelector('#stage'),loading=document.querySelector('#loading');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91a9b5);
scene.fog=new THREE.Fog(0x91a9b5,260,620);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,1200);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.06;
controls.minDistance=24;
controls.maxDistance=480;
controls.maxPolarAngle=Math.PI*.49;
controls.target.set(0,10,0);

scene.add(new THREE.HemisphereLight(0xe4f1ff,0x263326,2.0));
const sun=new THREE.DirectionalLight(0xfff1d8,3.0);
sun.position.set(-100,180,110);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-150;sun.shadow.camera.right=150;
sun.shadow.camera.top=150;sun.shadow.camera.bottom=-150;
sun.shadow.bias=-.00015;
scene.add(sun);
const fill=new THREE.DirectionalLight(0x9dc7ff,1.0);
fill.position.set(120,90,-140);scene.add(fill);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(900,900),new THREE.MeshStandardMaterial({color:0x26352d,roughness:1}));
floor.rotation.x=-Math.PI/2;floor.position.y=-.08;floor.receiveShadow=true;scene.add(floor);

const views={
 broadcast:{p:[0,105,220],target:[0,12,0],fov:48},
 tactical:{p:[0,260,1],target:[0,0,0],fov:43},
 low:{p:[0,34,150],target:[0,9,0],fov:58}
};
const drone={active:false,yaw:0,pitch:-.35,speed:42,keys:new Set(),move:new Set(),drag:false,lastX:0,lastY:0};
let stadium=null,stadiumBounds=null;

function showLoadError(message){
 loading.style.display='grid';
 loading.innerHTML='<div><strong style="color:#ffb4a8">STADIUM MODEL COULD NOT LOAD</strong><small style="display:block;max-width:560px;margin:12px auto;color:#d5dcd5"></small><button id="retry">RETRY</button><small style="display:block;margin-top:12px">The model is hosted externally; check the connection and CORS access.</small></div>';
 loading.querySelector('small').textContent=message;
 loading.querySelector('#retry').addEventListener('click',()=>location.reload());
}
window.addEventListener('error',e=>showLoadError(e.message||'A script or WebGL error occurred.'));
window.addEventListener('unhandledrejection',e=>showLoadError(e.reason?.message||String(e.reason||'A module failed to load.')));

function applyView(name){
 const v=views[name]||views.broadcast;
 drone.active=name==='drone';
 document.querySelector('#drone-hud').classList.toggle('visible',drone.active);
 document.querySelector('#drone-help').classList.toggle('visible',drone.active);
 controls.enabled=!drone.active&&name==='tactical';
 if(drone.active){
  camera.position.set(0,stadiumBounds?stadiumBounds.max.y+75:90,stadiumBounds?stadiumBounds.max.z+80:150);
  drone.yaw=0;drone.pitch=-.42;camera.fov=62;camera.updateProjectionMatrix();updateDroneLook();
 }else{
  camera.position.set(...v.p);camera.fov=v.fov;camera.updateProjectionMatrix();
  controls.target.set(...v.target);controls.update();
 }
 document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name));
}
function updateDroneLook(){
 const cp=Math.cos(drone.pitch),dir=new THREE.Vector3(Math.sin(drone.yaw)*cp,Math.sin(drone.pitch),-Math.cos(drone.yaw)*cp);
 camera.lookAt(camera.position.clone().add(dir));
}

const loader=new GLTFLoader();
loader.setCrossOrigin('anonymous');
loader.load(
 'https://www.innerscene.com/api/library/football-stadium-f7b93967/download',
 gltf=>{
  stadium=gltf.scene;
  stadium.traverse(obj=>{
   if(!obj.isMesh)return;
   obj.castShadow=true;obj.receiveShadow=true;
   if(obj.material){const mats=Array.isArray(obj.material)?obj.material:[obj.material];for(const m of mats){if(m.map)m.map.colorSpace=THREE.SRGBColorSpace;}}
  });
  const bounds=new THREE.Box3().setFromObject(stadium);
  const center=bounds.getCenter(new THREE.Vector3());
  stadium.position.x-=center.x;
  stadium.position.z-=center.z;
  stadium.position.y-=bounds.min.y;
  scene.add(stadium);
  stadiumBounds=new THREE.Box3().setFromObject(stadium);
  const size=stadiumBounds.getSize(new THREE.Vector3());
  const maxDim=Math.max(size.x,size.z);
  camera.position.set(0,Math.max(75,size.y*2.65),Math.max(185,maxDim*1.12));
  camera.fov=48;camera.updateProjectionMatrix();
  controls.target.set(0,size.y*.28,0);controls.update();
  views.broadcast.p=[0,Math.max(75,size.y*2.65),Math.max(185,maxDim*1.12)];
  views.broadcast.target=[0,size.y*.28,0];
  views.tactical.p=[0,maxDim*1.5,.01];views.tactical.target=[0,0,0];
  views.low.p=[0,Math.max(28,size.y*.85),maxDim*.78];views.low.target=[0,size.y*.22,0];
  loading.style.display='none';
  document.querySelector('#status').textContent='CC0 STADIUM MODEL · REAL-WORLD SCALE · '+Math.round(size.x)+' × '+Math.round(size.z)+' M';
  applyView('broadcast');
 },
 undefined,
 error=>showLoadError(error?.message||'The stadium model request failed.')
);

const keyMap={w:'forward',arrowup:'forward',s:'back',arrowdown:'back',a:'left',arrowleft:'left',d:'right',arrowright:'right',q:'down',e:'up'};
window.addEventListener('keydown',e=>{if(!drone.active)return;const k=e.key.toLowerCase();if(keyMap[k]){drone.keys.add(keyMap[k]);e.preventDefault();}});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(keyMap[k])drone.keys.delete(keyMap[k]);});
document.querySelectorAll('.drone-pad button').forEach(b=>{
 const move=b.dataset.move;
 const start=e=>{e.preventDefault();drone.move.add(move);b.setPointerCapture?.(e.pointerId);};
 const stop=e=>{e.preventDefault();drone.move.delete(move);};
 b.addEventListener('pointerdown',start);b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('lostpointercapture',stop);
});
renderer.domElement.addEventListener('pointerdown',e=>{if(!drone.active)return;drone.drag=true;drone.lastX=e.clientX;drone.lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);});
renderer.domElement.addEventListener('pointermove',e=>{
 if(!drone.active||!drone.drag)return;
 const dx=e.clientX-drone.lastX,dy=e.clientY-drone.lastY;drone.lastX=e.clientX;drone.lastY=e.clientY;
 drone.yaw-=dx*.004;drone.pitch=Math.max(-1.28,Math.min(-.06,drone.pitch-dy*.003));updateDroneLook();
});
renderer.domElement.addEventListener('pointerup',()=>drone.drag=false);
renderer.domElement.addEventListener('pointercancel',()=>drone.drag=false);
renderer.domElement.addEventListener('wheel',e=>{
 if(!drone.active)return;e.preventDefault();
 const dir=new THREE.Vector3(Math.sin(drone.yaw)*Math.cos(drone.pitch),Math.sin(drone.pitch),-Math.cos(drone.yaw)*Math.cos(drone.pitch));
 camera.position.addScaledVector(dir,e.deltaY*.035);
},{passive:false});
function updateDrone(dt){
 if(!drone.active)return;
 const active=new Set([...drone.keys,...drone.move]);
 const forward=new THREE.Vector3(Math.sin(drone.yaw),0,-Math.cos(drone.yaw));
 const right=new THREE.Vector3(Math.cos(drone.yaw),0,Math.sin(drone.yaw));
 const step=drone.speed*dt;
 if(active.has('forward'))camera.position.addScaledVector(forward,step);
 if(active.has('back'))camera.position.addScaledVector(forward,-step);
 if(active.has('left'))camera.position.addScaledVector(right,-step);
 if(active.has('right'))camera.position.addScaledVector(right,step);
 if(active.has('up'))camera.position.y+=step;
 if(active.has('down'))camera.position.y-=step;
 camera.position.y=Math.max(5,camera.position.y);updateDroneLook();
}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>applyView(b.dataset.view)));
document.querySelector('#back').addEventListener('click',()=>location.href='./');
window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);
});
let previous=performance.now();
function animate(now=performance.now()){
 requestAnimationFrame(animate);
 const dt=Math.min(.05,(now-previous)/1000);previous=now;
 if(controls.enabled)controls.update();
 updateDrone(dt);
 renderer.render(scene,camera);
}
animate();
</script></body></html>
