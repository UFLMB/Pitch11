<script type="module">

const host=document.querySelector('#stage'),loading=document.querySelector('#loading');

const crowdSpacing=lowPower ? .68 : .52;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x15263a);
scene.fog=new THREE.Fog(0x15263a,320,720);

function applyView(name){
 const v=views[name]||views.broadcast;
 drone.active=name==='drone';
 document.querySelector('#drone-hud').classList.toggle('visible',drone.active);
 document.querySelector('#drone-help').classList.toggle('visible',drone.active);

function updateDroneLook(){

}


const matchdayState={ledTextures:[],ledCanvas:null,ledContext:null,lastLedUpdate:0,flags:[]};
function roundedRectPolyline(hx,hz,r){
 const points=[];
 const line=(x1,z1,x2,z2)=>{const n=Math.max(2,Math.ceil(Math.hypot(x2-x1,z2-z1)/1.4));for(let i=0;i<n;i++){const t=i/n;points.push({x:x1+(x2-x1)*t,z:z1+(z2-z1)*t});}};
 const arc=(cx,cz,rad,a0,a1)=>{const n=Math.max(8,Math.ceil(Math.abs(a1-a0)*rad/1.4));for(let i=0;i<n;i++){const a=a0+(a1-a0)*i/n;points.push({x:cx+Math.cos(a)*rad,z:cz+Math.sin(a)*rad});}};
 line(-hx+r,-hz,hx-r,-hz);
 arc(hx-r,-hz+r,r,-Math.PI/2,0);
 line(hx,-hz+r,hx,hz-r);
 arc(hx-r,hz-r,r,0,Math.PI/2);
 line(hx-r,hz,-hx+r,hz);
 arc(-hx+r,hz-r,r,Math.PI/2,Math.PI);
 line(-hx,hz-r,-hx,-hz+r);
 arc(-hx+r,-hz+r,r,Math.PI,Math.PI*1.5);
 return points;
}
function crowdRowSamples(points,spacing){
 const lengths=[],total={value:0};
 for(let i=0;i<points.length;i++){const a=points[i],b=points[(i+1)%points.length],len=Math.hypot(b.x-a.x,b.z-a.z);lengths.push(len);total.value+=len;}
 const count=Math.max(1,Math.floor(total.value/spacing)),samples=[];
 let seg=0,base=0;
 for(let i=0;i<count;i++){
  const d=(i+.5)*total.value/count;
  while(seg<lengths.length-1&&base+lengths[seg]<d){base+=lengths[seg];seg++;}
  const a=points[seg],b=points[(seg+1)%points.length],t=(d-base)/Math.max(.0001,lengths[seg]);
  samples.push({x:a.x+(b.x-a.x)*t,z:a.z+(b.z-a.z)*t});
 }
 return samples;
}
function buildCrowd(){
 const rows=[];
 for(let r=0;r<24;r++){
  const offset=6+r*.8,points=roundedRectPolyline(60+offset,40+offset,12+offset*.35);
  rows.push({points,y:2.15+r*.34});
 }
 for(let r=0;r<20;r++){
  const offset=26+r*.8,points=roundedRectPolyline(60+offset,40+offset,12+offset*.35);
  rows.push({points,y:18.0+r*.34});
 }
 const samples=rows.map(row=>crowdRowSamples(row.points,crowdSpacing));
 const count=samples.reduce((sum,row)=>sum+row.length,0);
 const torsoGeo=new THREE.CylinderGeometry(.135,.17,.48,5,1);
 const headGeo=new THREE.SphereGeometry(.105,5,4);
 const torsoMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.96,metalness:0});
 const headMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.9,metalness:0});
 const torsos=new THREE.InstancedMesh(torsoGeo,torsoMat,count);
 const heads=new THREE.InstancedMesh(headGeo,headMat,count);
 torsos.name='MATCHDAY CROWD · SEATED SUPPORTERS';
 heads.name='MATCHDAY CROWD · HEADS';
 torsos.frustumCulled=false;heads.frustumCulled=false;
 const bodyPalette=[0x172c43,0x253b57,0x3d2529,0xb8b9b2,0x1c382d,0x8e3c2d,0xd1b98b,0x34353b,0x657b8c,0x8a9a9a,0x253b34,0x6c2637];
 const skinPalette=[0xd5a47f,0xb97f5e,0x8e5b43,0xe2bd9b,0x704936,0xc99470];
 const dummy=new THREE.Object3D(),instanceColor=new THREE.Color();
 let index=0,seed=7411;
 const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
 rows.forEach((row,rowIndex)=>{
  for(const p of samples[rowIndex]){
   const jitter=(rand()-.5)*.11,radial=Math.hypot(p.x,p.z)||1;
   const x=p.x+p.x/radial*jitter,z=p.z+p.z/radial*jitter;
   const yaw=Math.atan2(-x,-z)+(rand()-.5)*.32;
   const scale=.88+rand()*.22;
   dummy.position.set(x,row.y+.31*scale,z);dummy.rotation.set(0,yaw,0);dummy.scale.set(scale,scale,scale);dummy.updateMatrix();
   torsos.setMatrixAt(index,dummy.matrix);
   instanceColor.setHex(bodyPalette[Math.floor(rand()*bodyPalette.length)]);torsos.setColorAt(index,instanceColor);
   dummy.position.set(x,row.y+.69*scale,z);dummy.rotation.set(0,yaw,0);dummy.scale.setScalar(scale);dummy.updateMatrix();
   heads.setMatrixAt(index,dummy.matrix);
   instanceColor.setHex(skinPalette[Math.floor(rand()*skinPalette.length)]);heads.setColorAt(index,instanceColor);
   index++;
  }
 });
 torsos.instanceMatrix.needsUpdate=true;heads.instanceMatrix.needsUpdate=true;
 if(torsos.instanceColor)torsos.instanceColor.needsUpdate=true;
 if(heads.instanceColor)heads.instanceColor.needsUpdate=true;
 torsos.computeBoundingSphere();heads.computeBoundingSphere();
 scene.add(torsos,heads);
 return count;
}
function drawLedTexture(ctx,canvas,phase){
 const g=ctx.createLinearGradient(0,0,0,canvas.height);g.addColorStop(0,'#14232d');g.addColorStop(.5,'#07131c');g.addColorStop(1,'#203b36');
 ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
 const labels=['PITCH 11  ·  EVERY CARD. ONE ARENA.','MATCHDAY LIVE','PLAY BEAUTIFUL','ULTIMATE FOOTBALL'];
 const colors=['#b5e65b','#f2c66d','#79d7cf','#f0f2e8'];
 const block=canvas.width/4;
 for(let i=0;i<4;i++){
  const x=i*block;
  ctx.fillStyle=colors[i];ctx.globalAlpha=.12;ctx.fillRect(x+4,0,block-8,canvas.height);ctx.globalAlpha=1;
  ctx.fillStyle=colors[i];ctx.fillRect(x+12,18,4,canvas.height-36);
  ctx.font='900 29px Arial, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(labels[i],x+block/2+8,canvas.height/2);
 }
 ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(0,0,canvas.width,3);ctx.fillStyle='rgba(190,255,145,.48)';ctx.fillRect((phase*96)%canvas.width,canvas.height-7,180,4);
}
function addLedBoard(length,x,z,rotation){
 const group=new THREE.Group();
 const base=new THREE.Mesh(new THREE.BoxGeometry(length,1.02,.32),new THREE.MeshStandardMaterial({color:0x071018,roughness:.42,metalness:.55}));
 group.add(base);
 const canvas=document.createElement('canvas');canvas.width=1024;canvas.height=128;
 const ctx=canvas.getContext('2d');drawLedTexture(ctx,canvas,0);
 const texture=new THREE.CanvasTexture(canvas);texture.colorSpace=THREE.SRGBColorSpace;texture.wrapS=THREE.RepeatWrapping;texture.repeat.set(length/5.76,1);
 matchdayState.ledTextures.push({texture,canvas,ctx});
 const screen=new THREE.Mesh(new THREE.PlaneGeometry(length-.18,.76),new THREE.MeshStandardMaterial({color:0xffffff,map:texture,emissive:0xffffff,emissiveMap:texture,emissiveIntensity:1.2,roughness:.35,metalness:.08,side:THREE.DoubleSide}));
 screen.position.z=.166;group.add(screen);
 const glow=new THREE.Mesh(new THREE.BoxGeometry(length,.035,.34),new THREE.MeshBasicMaterial({color:0x8ddf78}));
 glow.position.y=.53;group.add(glow);
 group.position.set(x,.83,z);group.rotation.y=rotation;group.name='PITCH 11 · LED PERIMETER BOARD';scene.add(group);
}
function addFloodlights(){
 const positions=[[-91,34,-70],[-30,37,-78],[30,37,-78],[91,34,-70],[-91,34,70],[-30,37,78],[30,37,78],[91,34,70]];
 positions.forEach((p,i)=>{

function addMatchdayFlags(){
 const colors=[0xa3e635,0xe7e8df,0x1e4358,0xd8ad53,0x9b3844,0x315b48];
 const positions=[];
 for(let i=0;i<6;i++){const x=-52+i*20;positions.push([x,-75]);positions.push([x,75]);}
 for(let i=0;i<4;i++){const z=-30+i*20;positions.push([-94,z]);positions.push([94,z]);}
 positions.forEach((p,i)=>{
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(.025,.03,2.1,6),new THREE.MeshStandardMaterial({color:0x9ca7a8,metalness:.65,roughness:.35}));
  pole.position.set(p[0],22.4,p[1]);scene.add(pole);
  const flagGeo=new THREE.PlaneGeometry(1.05,.68,5,3);
  const pos=flagGeo.attributes.position;
  for(let j=0;j<pos.count;j++){const x=pos.getX(j),y=pos.getY(j);pos.setZ(j,Math.sin((x+1)*2.4)*.08*(y+.34)/.68);}

  const flag=new THREE.Mesh(flagGeo,new THREE.MeshStandardMaterial({color:colors[i%colors.length],roughness:.82,side:THREE.DoubleSide}));
  flag.position.set(p[0]+.53,23.05,p[1]);flag.userData.phase=i*.73;matchdayState.flags.push(flag);scene.add(flag);
 });
}
function addBroadcastCameras(){
 const positions=[[-42,-43.5],[0,-44],[42,-43.5]];
 positions.forEach(([x,z])=>{
  const platform=new THREE.Mesh(new THREE.BoxGeometry(2.8,.22,1.8),new THREE.MeshStandardMaterial({color:0x202a30,metalness:.7,roughness:.55}));

 });
}
function loadSidelineAssets(){

  [[-12.5,36.5],[12.5,36.5]].forEach(([x,z])=>{
   const dugout=gltf.scene.clone(true);dugout.position.set(x,.04,z);dugout.rotation.y=Math.PI;dugout.traverse(o=>{if(o.isMesh){o.castShadow=false;o.receiveShadow=false;}});scene.add(dugout);

function buildMatchdayDetails(){

 addFloodlights();addMatchdayFlags();addBroadcastCameras();loadSidelineAssets();
 document.querySelector('#status').textContent='MATCHDAY LIVE · '+crowdCount.toLocaleString('en-US')+' CROWD INSTANCES · LED RIBBON · FLOODLIGHTS';
}
function updateMatchday(now){
 matchdayState.flags.forEach(flag=>{flag.rotation.y=Math.sin(now*.0017+flag.userData.phase)*.09;});
 if(now-matchdayState.lastLedUpdate<1200)return;
 matchdayState.lastLedUpdate=now;
 matchdayState.ledTextures.forEach(({texture,canvas,ctx},i)=>{drawLedTexture(ctx,canvas,now/1000+i*.4);texture.needsUpdate=true;});
}

const loader=new GLTFLoader();
loader.setCrossOrigin('anonymous');
loader.load(
 './assets/football-stadium.glb',
 gltf=>{
  stadium=gltf.scene;
  stadium.traverse(obj=>{
   if(!obj.isMesh)return;
   obj.castShadow=false;obj.receiveShadow=false;
   if(obj.material){const mats=Array.isArray(obj.material)?obj.material:[obj.material];for(const m of mats){if(m.map)m.map.colorSpace=THREE.SRGBColorSpace;}}
  });
  const bounds=new THREE.Box3().setFromObject(stadium);
  const center=bounds.getCenter(new THREE.Vector3());
  stadium.position.x-=center.x;
  stadium.position.z-=center.z;
  stadium.position.y-=bounds.min.y;
  scene.add(stadium);
  stadiumBounds=new THREE.Box3().setFromObject(stadium);
  buildMatchdayDetails();
  const size=stadiumBounds.getSize(new THREE.Vector3());
  const maxDim=Math.max(size.x,size.z);
  camera.position.set(0,Math.max(75,size.y*2.65),Math.max(185,maxDim*1.12));
  camera.fov=48;camera.updateProjectionMatrix();
  controls.target.set(0,size.y*.28,0);controls.update();
  views.broadcast.p=[0,Math.max(75,size.y*2.65),Math.max(185,maxDim*1.12)];
  views.broadcast.target=[0,size.y*.28,0];
  views.tactical.p=[0,maxDim*1.5,.01];views.tactical.target=[0,0,0];
  views.low.p=[0,Math.max(28,size.y*.85),maxDim*.78];views.low.target=[0,size.y*.22,0];
  loading.style.display='none';
  document.querySelector('#status').textContent='MATCHDAY LIVE · REAL-WORLD SCALE · '+Math.round(size.x)+' × '+Math.round(size.z)+' M';
  applyView('broadcast');
 },
 undefined,
 error=>showLoadError(error?.message||'The stadium model request failed.')
);

const keyMap={w:'forward',arrowup:'forward',s:'back',arrowdown:'back',a:'left',arrowleft:'left',d:'right',arrowright:'right',q:'down',e:'up'};
window.addEventListener('keydown',e=>{if(!drone.active)return;const k=e.key.toLowerCase();if(keyMap[k]){drone.keys.add(keyMap[k]);e.preventDefault();}});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(keyMap[k])drone.keys.delete(keyMap[k]);});
document.querySelectorAll('.drone-pad button').forEach(b=>{
 const move=b.dataset.move;
 const start=e=>{e.preventDefault();drone.move.add(move);b.setPointerCapture?.(e.pointerId);};
 const stop=e=>{e.preventDefault();drone.move.delete(move);};
 b.addEventListener('pointerdown',start);b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('lostpointercapture',stop);
});
renderer.domElement.addEventListener('pointerdown',e=>{if(!drone.active)return;drone.drag=true;drone.lastX=e.clientX;drone.lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);});
renderer.domElement.addEventListener('pointermove',e=>{
 if(!drone.active||!drone.drag)return;
 const dx=e.clientX-drone.lastX,dy=e.clientY-drone.lastY;drone.lastX=e.clientX;drone.lastY=e.clientY;
 drone.yaw-=dx*.004;drone.pitch=Math.max(-1.28,Math.min(-.06,drone.pitch-dy*.003));updateDroneLook();
});
renderer.domElement.addEventListener('pointerup',()=>drone.drag=false);
renderer.domElement.addEventListener('pointercancel',()=>drone.drag=false);
renderer.domElement.addEventListener('wheel',e=>{
 if(!drone.active)return;e.preventDefault();
 const dir=new THREE.Vector3(Math.sin(drone.yaw)*Math.cos(drone.pitch),Math.sin(drone.pitch),-Math.cos(drone.yaw)*Math.cos(drone.pitch));
 camera.position.addScaledVector(dir,e.deltaY*.035);
},{passive:false});
function updateDrone(dt){
 if(!drone.active)return;
 const active=new Set([...drone.keys,...drone.move]);
 const forward=new THREE.Vector3(Math.sin(drone.yaw),0,-Math.cos(drone.yaw));
 const right=new THREE.Vector3(Math.cos(drone.yaw),0,Math.sin(drone.yaw));
 const step=drone.speed*dt;
 if(active.has('forward'))camera.position.addScaledVector(forward,step);
 if(active.has('back'))camera.position.addScaledVector(forward,-step);
 if(active.has('left'))camera.position.addScaledVector(right,-step);
 if(active.has('right'))camera.position.addScaledVector(right,step);
 if(active.has('up'))camera.position.y+=step;
 if(active.has('down'))camera.position.y-=step;
 camera.position.y=Math.max(5,camera.position.y);updateDroneLook();
}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>applyView(b.dataset.view)));
document.querySelector('#back').addEventListener('click',()=>location.href='./');
window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,renderPixelRatio));renderer.setSize(innerWidth,innerHeight);
});
let previous=performance.now(),lastRender=0;
function animate(now=performance.now()){
 requestAnimationFrame(animate);
 if(now-lastRender<targetFrameMs)return;
 lastRender=now;
 const dt=Math.min(.05,(now-previous)/1000);previous=now;
 if(controls.enabled)controls.update();
 updateDrone(dt);
 updateMatchday(now);
 renderer.render(scene,camera);
}
animate();
</script></body></html>
