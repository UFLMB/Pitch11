window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(keyMap[k])drone.keys.delete(keyMap[k]);});
document.querySelectorAll('.drone-pad button').forEach(b=>{const move=b.dataset.move;const start=e=>{e.preventDefault();drone.move.add(move);b.setPointerCapture?.(e.pointerId);};const stop=e=>{e.preventDefault();drone.move.delete(move);};b.addEventListener('pointerdown',start);b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('lostpointercapture',stop);});
renderer.domElement.addEventListener('pointerdown',e=>{if(!drone.active)return;drone.drag=true;drone.lastX=e.clientX;drone.lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);});
renderer.domElement.addEventListener('pointermove',e=>{if(!drone.active||!drone.drag)return;const dx=e.clientX-drone.lastX,dy=e.clientY-drone.lastY;drone.lastX=e.clientX;drone.lastY=e.clientY;drone.yaw-=dx*.004;drone.pitch=Math.max(-1.28,Math.min(-.06,drone.pitch-dy*.003));updateDroneLook();});
renderer.domElement.addEventListener('pointerup',()=>drone.drag=false);renderer.domElement.addEventListener('pointercancel',()=>drone.drag=false);
renderer.domElement.addEventListener('wheel',e=>{if(!drone.active)return;e.preventDefault();const dir=new THREE.Vector3(Math.sin(drone.yaw)*Math.cos(drone.pitch),Math.sin(drone.pitch),-Math.cos(drone.yaw)*Math.cos(drone.pitch));camera.position.addScaledVector(dir,e.deltaY*.035);camera.position.y=Math.max(7,Math.min(125,camera.position.y));},{passive:false});
function updateDrone(dt){if(!drone.active)return;const active=new Set([...drone.keys,...drone.move]);const forward=new THREE.Vector3(Math.sin(drone.yaw),0,-Math.cos(drone.yaw));const right=new THREE.Vector3(Math.cos(drone.yaw),0,Math.sin(drone.yaw));const step=drone.speed*dt;if(active.has('forward'))camera.position.addScaledVector(forward,step);if(active.has('back'))camera.position.addScaledVector(forward,-step);if(active.has('left'))camera.position.addScaledVector(right,-step);if(active.has('right'))camera.position.addScaledVector(right,step);if(active.has('up'))camera.position.y+=step;if(active.has('down'))camera.position.y-=step;camera.position.y=Math.max(6,Math.min(130,camera.position.y));updateDroneLook();}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));document.querySelector('#back').addEventListener('click',()=>location.href='./');
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);});
let previous=performance.now();function animate(now=performance.now()){requestAnimationFrame(animate);const dt=Math.min(.05,(now-previous)/1000);previous=now;controls.update();updateDrone(dt);renderer.render(scene,camera);}loading.style.display='none';animate();
</script></body></html>
