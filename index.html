<script>


/* --- IFAB Law 14 (2026/27): accidental penalty-kicker double touch --- */
function resolveAccidentalPenaltyDoubleTouch(goalScored){
  const goalkeeperOffence=!!ball.penaltyKeeperOffLine;
  const decision=PITCH11Law.penaltyAccidentalDoubleTouchDecision({
    doubleTouch:ball.penaltyDoubleTouch,completed:true,goalScored:!!goalScored,goalkeeperOffence
  });
  if(decision==='continue')return false;
  const team=ball.penaltyTeam,kicker=ball.penaltyKicker,x=ball.x,y=ball.y;
  if(decision==='retake'&&!goalScored&&goalkeeperOffence){
    retakePenaltyForKeeperOffence();
    return true;
  }
  clearPenaltyLineState();
  if(decision==='retake'){
    S.penaltyRetake=true;
    whistleStop(1.2,'PENALTY RETAKE','Accidental double touch',()=>{
      try{setupPen(team,kicker&&!kicker.out&&!kicker.inj?kicker:firstIn(team),false);}
      finally{S.penaltyRetake=false;}
    });
  }else{
    whistleStop(1.2,'INDIRECT FREE KICK','Accidental double touch',()=>freeKick(1-team,x,y,true));
  }
  return true;
}
const _goalLaw14AccidentalDoubleTouch=goal;
goal=function(dr){
  if(ball.pen&&!ball.penaltyWasShootout&&resolveAccidentalPenaltyDoubleTouch(true))return;
  _goalLaw14AccidentalDoubleTouch(dr);
};
const _outOfPlayLaw14AccidentalDoubleTouch=outOfPlay;
outOfPlay=function(){
  if(ball.pen&&!ball.penaltyWasShootout&&resolveAccidentalPenaltyDoubleTouch(false))return;
  _outOfPlayLaw14AccidentalDoubleTouch();
};
const _updateLaw14AccidentalDoubleTouch=update;
update=function(){
  _updateLaw14AccidentalDoubleTouch();
  if(ball.pen&&!ball.penaltyWasShootout&&ball.penaltyDoubleTouch&&(
    (ball.owner&&ball.owner!==ball.penaltyKicker)||(!ball.owner&&ball.z<=1&&Math.hypot(ball.vx,ball.vy)<3)))
    resolveAccidentalPenaltyDoubleTouch(false);
};

/* IFAB restart laws: the original taker may not touch the ball again before another player. */
const _takeRestartSecondTouch=take;
take=function(p,byHand=false){
  if(p&&p===ball.dbl&&ball.last===p&&!ball.pen&&!S.so){
    const d=dirOf(p.team),gx=d>0?PX0:PX1;
    const insideOwnPenaltyArea=(ball.x-gx)*d>=0&&(ball.x-gx)*d<=PEN_DEPTH&&Math.abs(ball.y-CY)<=PEN_WIDTH/2;
    const decision=PITCH11Law.restartSecondTouchRestart({
      isKicker:true,insideOwnPenaltyArea,restartKind:ball.dblKind
    });
    ball.restartDoubleTouchPending={player:p,x:ball.x,y:ball.y,kind:ball.dblKind,decision};
    return;
  }
  _takeRestartSecondTouch(p,byHand);
};

<script>
/* PITCH 11 audio arbitration: one playback source per action, avoiding stacked sample+synth duplicates. */
(()=>{
  if(typeof AU==='undefined')return;
  AU.kick=function(v){window.P11AudioAssets?.play('kick',Math.min(1,Math.max(.35,v/500)));};
  AU.whistle=function(len,n){window.P11AudioAssets?.play('whistle',n>1?.95:.72);};
  AU.event=function(type){
    window.P11AudioAssets?.event(type);
    if(type==='goal')this.roar(1.4);
  };
  AU.post=function(v){const k=clamp(v/500,.3,1);window.P11AudioAssets?.play('post',.35+k*.45);};
  AU.bounce=function(v){const k=clamp(v/300,.12,1);window.P11AudioAssets?.play('bounce',.3+k*.42);};
  AU.click=function(){window.P11AudioAssets?.play('uiClick',.45);};
  /* A goal already has a net sample and a crowd reaction; suppress the legacy
     layered net/cheer/horn/drum/applause stack for that same single event. */
  AU.goalFx=function(){};
  AU.horn=function(){};
  AU.drums=function(){};
  AU.applause=function(){};
})();
</script>
<script>
/* Mobile-only immersive display: installed PWA starts fullscreen;
   regular mobile browsers request fullscreen on the first user gesture. */
(()=>{
  const coarse=window.matchMedia&&window.matchMedia('(pointer:coarse)').matches;
  const smallScreen=Math.min(screen.width||innerWidth,screen.height||innerHeight)<=600;
  const mobile=(navigator.userAgentData&&navigator.userAgentData.mobile===true)||
    /Android.*Mobile|iPhone|iPod|Windows Phone/i.test(navigator.userAgent)||
    (coarse&&smallScreen);
  if(!mobile)return;
  const standalone=()=>(
    (window.matchMedia&&(
      window.matchMedia('(display-mode:standalone)').matches||
      window.matchMedia('(display-mode:fullscreen)').matches
    ))||navigator.standalone===true
  );
  const enterFullscreen=()=>{
    if(standalone()||document.fullscreenElement)return;
    const root=document.documentElement;
    if(typeof root.requestFullscreen!=='function')return;
    root.requestFullscreen().then(()=>{
      document.removeEventListener('pointerdown',enterFullscreen,true);
      document.removeEventListener('touchstart',enterFullscreen,true);
    }).catch(()=>{});
  };
  if(!standalone()){
    const gestureEvent='PointerEvent' in window?'pointerdown':'touchstart';
    document.addEventListener(gestureEvent,enterFullscreen,true);
  }
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}),{once:true});
  }
})();
</script>


<script>
/* Matchday loading: a 15-second pre-match sequence, with real boot readiness as the final gate. */
(()=>{const screen=document.getElementById('p11-loading-screen');if(!screen)return;
const fill=document.getElementById('p11-loading-fill'),percent=document.getElementById('p11-loading-percent'),status=document.getElementById('p11-loading-status'),button=document.getElementById('p11-loading-continue');
const started=performance.now(),DURATION=15000,FINAL_PHASE=2000;
const scenes=[
{at:0,text:'THE FLOODLIGHTS COME ALIVE'},
{at:2100,text:'THE PITCH GETS ITS FINAL CHECK'},
{at:4200,text:'THE STANDS ARE FILLING UP'},
{at:6300,text:'BOTH TEAMS ARE IN THE TUNNEL'},
{at:8400,text:'THE PLAYERS WALK OUT'},
{at:10500,text:'CAPTAINS MEET THE OFFICIALS'},
{at:12600,text:'KICK-OFF IS JUST MOMENTS AWAY'}
];
let finished=false,lastScene=-1;
const hide=()=>{if(finished)return;finished=true;screen.classList.add('is-hidden');window.setTimeout(()=>screen.remove(),720);};
button.addEventListener('click',hide);
const tick=now=>{if(finished)return;const b=window.P11StadiumBoot||{},model=b.playerModel||{};
const elapsed=now-started,stadiumReady=b.state==='ready',modelReady=model.state==='ready',allReady=stadiumReady&&modelReady;
const failed=['error','runtime-error'].includes(b.state)||['error','asset-error'].includes(model.state);
const sp=stadiumReady?1:Math.max(0,Math.min(1,Number(b.progress)||0)),mp=modelReady?1:Math.max(0,Math.min(1,Number(model.progress)||0));
const measured=(sp*.14+mp*.86)*100;
let value=Math.min(85,Math.round(measured));
if(allReady&&elapsed>=DURATION-FINAL_PHASE)value=Math.min(100,85+Math.round(15*Math.min(1,(elapsed-(DURATION-FINAL_PHASE))/FINAL_PHASE)));
if(allReady&&elapsed>=DURATION)value=100;
fill.style.width=value+'%';percent.textContent=failed?'—':value+'%';
if(failed){screen.classList.add('has-error');status.textContent='MATCHDAY — READY WHEN YOU ARE';}
else{
const sceneIndex=scenes.reduce((found,scene,i)=>elapsed>=scene.at?i:found,0);
if(sceneIndex!==lastScene){lastScene=sceneIndex;status.textContent=scenes[sceneIndex].text;}
if(allReady&&elapsed>=DURATION){status.textContent='READY FOR KICK-OFF';hide();}
}
if(!finished)requestAnimationFrame(tick);};requestAnimationFrame(tick);})();
</script>
