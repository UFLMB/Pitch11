name: Temporary goalkeeper FBX retrieval

on:
  push:
    branches:
      - assets/goalkeeper-animation-review
    paths:
      - .github/workflows/retrieve-goalkeeper-fbx.yml

permissions:
  contents: read

jobs:
  package-goalkeeper-animations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify animation package
        run: |
          test "$(find input/goalkeeper-animations -maxdepth 1 -type f -name '*.fbx' | wc -l)" -eq 15
          find input/goalkeeper-animations -maxdepth 1 -type f -name '*.fbx' -printf '%f %s bytes\n' | sort
      - name: Upload original goalkeeper FBX files
        uses: actions/upload-artifact@v4
        with:
          name: pitch11-goalkeeper-animation-review
          path: input/goalkeeper-animations/
          if-no-files-found: error
          retention-days: 1
