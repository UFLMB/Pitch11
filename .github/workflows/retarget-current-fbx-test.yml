name: Current FBX retarget compatibility test

on:
  workflow_dispatch:
  push:
    branches: [test/current-fbx-retarget]
    paths:
      - "scripts/retarget-current-fbx-test.py"
      - "scripts/retarget-current-fbx-export.py"
      - "scripts/decode-player-glb.mjs"
      - ".github/workflows/retarget-current-fbx-test.yml"

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install GLB decode dependencies
        run: npm install --no-save @gltf-transform/core @gltf-transform/extensions meshoptimizer
      - name: Decode player GLB meshopt data to a temporary file
        env:
          INPUT_GLB: assets/players/player.glb
          OUTPUT_GLB: /tmp/player-uncompressed.glb
        run: node scripts/decode-player-glb.mjs
      - name: Install Blender and NumPy
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          export PYTHONPATH="/usr/lib/python3/dist-packages:${PYTHONPATH:-}"
          blender --background --python-expr "import sys, numpy; print('BLENDER_PYTHON', sys.version); print('BLENDER_NUMPY_OK', numpy.__version__)"
      - name: Import both rigs and inspect mapping
        env:
          FBX_PATH: input/player-package/jog forward.fbx
          GLB_PATH: /tmp/player-uncompressed.glb
          REPORT_PATH: retarget-test-report.json
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: blender --background --python scripts/retarget-current-fbx-test.py
      - name: Bake animation onto current player rig and export temporary GLB
        env:
          FBX_PATH: input/player-package/jog forward.fbx
          GLB_PATH: /tmp/player-uncompressed.glb
          OUTPUT_GLB: /tmp/player-retargeted.glb
          REPORT_PATH: retarget-export-report.json
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: blender --background --python scripts/retarget-current-fbx-export.py
      - name: Verify retargeted GLB export
        run: |
          test -s retarget-export-report.json
          python3 -c "import json; d=json.load(open('retarget-export-report.json')); assert d['retarget_export_verified']; assert d['mapped_bone_count'] >= 20; assert d['reimport_animation_track_count'] >= 20; print('Retargeted GLB re-import verified:', d['mapped_bone_count'], 'mapped bones,', d['reimport_animation_track_count'], 'animation tracks,', d['baked_frame_count'], 'baked frames')"
      - name: Upload compatibility and retarget reports
        if: always() && (hashFiles('retarget-test-report.json') != '' || hashFiles('retarget-export-report.json') != '')
        uses: actions/upload-artifact@v4
        with:
          name: current-fbx-retarget-test
          path: |
            retarget-test-report.json
            retarget-export-report.json
          retention-days: 14
