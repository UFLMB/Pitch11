name: Generate player UV mapping atlases

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "input/FULL-UV.txt.txt"
      - "scripts/generate-uv-mapping.py"
      - ".github/workflows/generate-uv-mapping.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare pinned Three.js for GLB texture extraction
        run: |
          mkdir -p /tmp/p11-three vendor
          npm pack three@0.170.0 --pack-destination /tmp/p11-three
          tar -xzf /tmp/p11-three/three-0.170.0.tgz -C vendor
          mv vendor/package vendor/three
          test -s vendor/three/examples/jsm/libs/meshopt_decoder.module.js
      - name: Download the player GLB used by the current asset audit
        run: |
          mkdir -p assets/players
          curl --fail --location --retry 3 --retry-delay 2 --user-agent "PITCH-11-GitHub-Actions" "https://models.codelove.in/models/sports-male-02.glb" --output assets/players/player.glb
          test "$(stat -c%s assets/players/player.glb)" -gt 1000
          test "$(head -c 4 assets/players/player.glb)" = "glTF"
      - name: Extract embedded textures and UV diagnostics
        run: node scripts/export-player-texture-audit.mjs /tmp/pitch11-player-texture-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image library
        run: python -m pip install --disable-pip-version-check Pillow==11.1.0
      - name: Generate and validate numbered UV atlases
        run: python scripts/generate-uv-mapping.py
      - name: Upload generated UV mapping package
        uses: actions/upload-artifact@v4
        with:
          name: pitch11-uv-mapping
          path: /tmp/pitch11-uv-mapping/
          if-no-files-found: error
          retention-days: 14
