# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Recovery note: a new commit SHA creates a fresh GitHub Pages deployment record
# if the Pages API leaves a previous commit's deployment in a failed state.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate consolidated player direction test page wiring
        run: node scripts/validate-player-direction-pages.mjs
      - name: Build and syntax-check player direction browser bundle
        run: |
          mkdir -p /tmp/p11-three vendor node_modules
          npm pack three@0.170.0 --pack-destination /tmp/p11-three
          tar -xzf /tmp/p11-three/three-0.170.0.tgz -C vendor
          mv vendor/package vendor/three
          ln -s ../vendor/three node_modules/three
          npx --yes esbuild@0.24.2 player-direction-test.js --bundle --format=esm --target=es2022 --outfile=/tmp/player-direction-test.bundle.js
          test -s /tmp/player-direction-test.bundle.js
          grep -q "GLTFLoader" /tmp/player-direction-test.bundle.js
          node --check /tmp/player-direction-test.bundle.js
      - name: Install FBX inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y assimp-utils
      - name: Inspect uploaded FBX animation package
        run: node scripts/inspect-player-fbx-package.mjs
      - name: Inspect Git LFS goalkeeper character candidate and animation rig compatibility
        run: node scripts/inspect-player-model-candidate.mjs
      - name: Check inline application scripts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const html = fs.readFileSync('index.html', 'utf8');
          const tags = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          const inline = tags.filter(([, attrs, body]) =>
            !/\bsrc\s*=/.test(attrs) &&
            !/type=["'](?:importmap|application\/ld\+json)["']/i.test(attrs) &&
            body.trim()
          );
          if (!inline.length) throw new Error('No inline application scripts found');
          inline.forEach(([, attrs, body], i) => {
            const ext = /type=["']module["']/i.test(attrs) ? 'mjs' : 'cjs';
            const file = `/tmp/pitch11-inline-${i}.${ext}`;
            fs.writeFileSync(file, body);
            const result = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
            if (result.status !== 0) {
              process.stderr.write(result.stderr || result.stdout);
              process.exit(result.status || 1);
            }
          });
          console.log(`Checked ${inline.length} inline application scripts.`);
          NODE
      - name: Validate PITCH 11 audio module and registered assets
        run: |
          node --check engine/audio-assets.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('engine/audio-assets.mjs', 'utf8');
          const paths = [...source.matchAll(/new URL\("..\/(Audio\/[^"]+)", import\.meta\.url\)/g)]
            .map(([, path]) => decodeURIComponent(path));
          if (paths.length !== 9) {
            throw new Error(`Expected 8 UI sound files plus 1 menu music file; found ${paths.length} registered paths.`);
          }
          for (const path of paths) {
            if (!fs.existsSync(path) || fs.statSync(path).size === 0) {
              throw new Error(`Registered audio asset is missing or empty: ${path}`);
            }
          }
          console.log(`Validated ${paths.length} registered audio assets.`);
          NODE
      - name: Check Player Kit Studio module syntax
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const html = fs.readFileSync('player-texture-editor.html', 'utf8');
          const startTag = '<script type="module">';
          const start = html.indexOf(startTag);
          const end = start < 0 ? -1 : html.indexOf('</script>', start + startTag.length);
          if (start < 0 || end < 0) throw new Error('Player Kit Studio module script not found');
          const source = html.slice(start + startTag.length, end);
          fs.writeFileSync('/tmp/pitch11-kit-studio.mjs', source);
          const result = spawnSync(process.execPath, ['--check', '/tmp/pitch11-kit-studio.mjs'], { encoding: 'utf8' });
          if (result.status !== 0) {
            process.stderr.write(result.stderr || result.stdout);
            process.exit(result.status || 1);
          }
          console.log('Player Kit Studio module syntax is valid.');
          NODE
      - name: Check independent Mixamo Kit Studio module syntax
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const html = fs.readFileSync('mixamo-kit-studio.html', 'utf8');
          const startTag = '<script type="module">';
          const start = html.indexOf(startTag);
          const end = start < 0 ? -1 : html.indexOf('</script>', start + startTag.length);
          if (start < 0 || end < 0) throw new Error('Mixamo Kit Studio module script not found');
          fs.writeFileSync('/tmp/pitch11-mixamo-kit-studio.mjs', html.slice(start + startTag.length, end));
          const result = spawnSync(process.execPath, ['--check', '/tmp/pitch11-mixamo-kit-studio.mjs'], { encoding: 'utf8' });
          if (result.status !== 0) {
            process.stderr.write(result.stderr || result.stdout);
            process.exit(result.status || 1);
          }
          console.log('Mixamo Kit Studio module syntax is valid.');
          NODE
      - name: Check Ball Studio module syntax
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const html = fs.readFileSync('ball-editor.html', 'utf8');
          const startTag = '<script type="module">';
          const start = html.indexOf(startTag);
          const end = start < 0 ? -1 : html.indexOf('</script>', start + startTag.length);
          if (start < 0 || end < 0) throw new Error('Ball Studio module script not found');
          fs.writeFileSync('/tmp/pitch11-ball-studio.mjs', html.slice(start + startTag.length, end));
          const result = spawnSync(process.execPath, ['--check', '/tmp/pitch11-ball-studio.mjs'], { encoding: 'utf8' });
          if (result.status !== 0) {
            process.stderr.write(result.stderr || result.stdout);
            process.exit(result.status || 1);
          }
          console.log('Ball Studio module syntax is valid.');
          NODE
      - name: Check 3D model viewer module syntax
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const html = fs.readFileSync('player-model-viewer.html', 'utf8');
          const startTag = '<script type="module">';
          const start = html.indexOf(startTag);
          const end = start < 0 ? -1 : html.indexOf('</script>', start + startTag.length);
          if (start < 0 || end < 0) throw new Error('3D model viewer module script not found');
          fs.writeFileSync('/tmp/pitch11-model-viewer.mjs', html.slice(start + startTag.length, end));
          const result = spawnSync(process.execPath, ['--check', '/tmp/pitch11-model-viewer.mjs'], { encoding: 'utf8' });
          if (result.status !== 0) {
            process.stderr.write(result.stderr || result.stdout);
            process.exit(result.status || 1);
          }
          console.log('3D model viewer module syntax is valid.');
          NODE
      - name: Check diagnostic 3D UV inspector module syntax
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const html = fs.readFileSync('uv-inspector.html', 'utf8');
          const startTag = '<script type="module">';
          const start = html.indexOf(startTag);
          const end = start < 0 ? -1 : html.indexOf('</script>', start + startTag.length);
          if (start < 0 || end < 0) throw new Error('3D UV inspector module script not found');
          fs.writeFileSync('/tmp/pitch11-uv-inspector.mjs', html.slice(start + startTag.length, end));
          const result = spawnSync(process.execPath, ['--check', '/tmp/pitch11-uv-inspector.mjs'], { encoding: 'utf8' });
          if (result.status !== 0) {
            process.stderr.write(result.stderr || result.stdout);
            process.exit(result.status || 1);
          }
          console.log('Canonical UV inspector module syntax is valid.');
          NODE
      - name: Check isolated Mixamo direct playback module syntax
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const html = fs.readFileSync('mixamo-direct-playback-test.html', 'utf8');
          const startTag = '<script type="module">';
          const start = html.indexOf(startTag);
          const end = start < 0 ? -1 : html.indexOf('</script>', start + startTag.length);
          if (start < 0 || end < 0) throw new Error('Mixamo direct playback module not found');
          fs.writeFileSync('/tmp/pitch11-mixamo-direct.mjs', html.slice(start + startTag.length, end));
          const result = spawnSync(process.execPath, ['--check', '/tmp/pitch11-mixamo-direct.mjs'], { encoding: 'utf8' });
          if (result.status !== 0) {
            process.stderr.write(result.stderr || result.stdout);
            process.exit(result.status || 1);
          }
          console.log('Mixamo direct playback module syntax is valid.');
          NODE
      - name: Check Goalkeeper Lab module syntax
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const html = fs.readFileSync('goalkeeper-lab.html', 'utf8');
          const startTag = '<script type="module">';
          const start = html.indexOf(startTag);
          const end = start < 0 ? -1 : html.indexOf('</script>', start + startTag.length);
          if (start < 0 || end < 0) throw new Error('Goalkeeper Lab module script not found');
          fs.writeFileSync('/tmp/pitch11-goalkeeper-lab.mjs', html.slice(start + startTag.length, end));
          const result = spawnSync(process.execPath, ['--check', '/tmp/pitch11-goalkeeper-lab.mjs'], { encoding: 'utf8' });
          if (result.status !== 0) {
            process.stderr.write(result.stderr || result.stdout);
            process.exit(result.status || 1);
          }
          console.log('Goalkeeper Lab module syntax is valid.');
          NODE
      - name: Check isolated Environment Lab runtime module syntax
        run: node --check stadium-environment-runtime.js
      - name: Validate runtime hardening fixes
        run: node scripts/validate-runtime-hardening.mjs
      - name: Validate Stadium Editor module and editing safeguards
        run: node scripts/validate-stadium-editor.mjs
      - name: Validate Environment Lab mobile WebGL startup
        run: node scripts/validate-environment-lab-mobile-webgl.mjs
      - name: Validate adaptive mobile HD graphics quality
        run: node scripts/validate-mobile-graphics-quality.mjs
      - name: Validate player UV inspector page consolidation
        run: node scripts/validate-player-uv-inspector-pages.mjs
      - name: Validate Environment Lab tunnel and stadium clearance geometry
        run: node scripts/validate-environment-lab-geometry.mjs

      - name: Validate adaptive HD environment render scale
        run: node scripts/validate-environment-graphics-quality.mjs
      - name: Validate ball branding text orientation
        run: node scripts/validate-ball-text-orientation.mjs
      - name: Check browser simulation module syntax
        run: |
          node --check engine/law-compliance.js
          node --check engine/pitchy.mjs
          node --check engine/pitchy-v2.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { analysePitchyBrief } from './engine/pitchy-v2.mjs';
          const hu = analysePitchyBrief('Készíts fekete-arany, agresszív, vékony átlós csíkos mezt fekete gallérral', 'kit');
          assert.equal(hu.detected.language, 'hu');
          assert.equal(hu.baseColor, '#101318');
          assert.equal(hu.accentColor, '#c5a46d');
          assert.equal(hu.pattern, 'diagonal-stripes');
          assert.equal(hu.style, 'performance');
          const en = analysePitchyBrief('Create a premium navy and gold jersey with a matte finish and vertical stripes', 'kit');
          assert.equal(en.detected.language, 'en');
          assert.equal(en.pattern, 'vertical-stripes');
          assert.equal(en.material, 'matte');
          const ball = analysePitchyBrief('Fényes piros-fehér labda', 'ball');
          assert.equal(ball.detected.language, 'hu');
          assert.equal(ball.material, 'glossy');
          assert.throws(() => analysePitchyBrief(''));
          console.log('PITCHY bilingual design reasoning tests passed.');
          NODE
          node --check engine/pitchy-v2.mjs
          node --test engine/pitchy-v2.test.mjs
          node --check engine/simulation.mjs
          node --check engine/simulation-lab.mjs
          node --check engine/pitch11-adapter.mjs
          node --check engine/broadcast-camera.mjs
          node --check engine/stadium-visibility.mjs
          node --check engine/stadium-model.mjs
          node --check engine/stadium-atmosphere.mjs
          node --check engine/goal-geometry.mjs
          node --check engine/player-animation-map.mjs
          node --check engine/mixamo-animation-catalog.mjs
          node --check engine/mixamo-track-binding.mjs
          node --check engine/player-animation.mjs
          node --check engine/player-model-state.mjs
          node --check engine/match-player-renderer.mjs
          node --check engine/player-renderer-performance.test.mjs
          node --check scripts/validate-player-assets.mjs
          node --check scripts/export-player-texture-audit.mjs
          node --check scripts/inspect-player-fbx-package.mjs
          node --check engine/league-soccer-ballphysics.mjs
          node --check stadium-runtime.js
      - name: Run simulation and adapter regression tests
        run: node --test engine/*.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Vendor pinned Three.js runtime for offline same-origin loading
        run: |
          mkdir -p /tmp/p11-three vendor
          npm pack three@0.170.0 --pack-destination /tmp/p11-three
          tar -xzf /tmp/p11-three/three-0.170.0.tgz -C vendor
          mv vendor/package vendor/three
          test -s vendor/three/build/three.module.js
          test -s vendor/three/examples/jsm/loaders/GLTFLoader.js
          test -s vendor/three/examples/jsm/loaders/FBXLoader.js
          test -s vendor/three/examples/jsm/utils/SkeletonUtils.js
          test -s vendor/three/examples/jsm/libs/meshopt_decoder.module.js
          test -s vendor/three/LICENSE
      - name: Bundle player direction diagnostic modules
        run: |
          mkdir -p node_modules
          ln -s ../vendor/three node_modules/three
          npx --yes esbuild@0.24.2 player-direction-test.js --bundle --format=esm --target=es2022 --outfile=player-direction-test.bundle.js
          test -s player-direction-test.bundle.js
          grep -q "GLTFLoader" player-direction-test.bundle.js
      - name: Download and validate stadium and player assets
        run: |
          sudo apt-get update
          sudo apt-get install -y assimp-utils
          mkdir -p assets
          curl --fail --location --retry 3 --retry-delay 2 --user-agent "PITCH-11-GitHub-Actions" "https://www.innerscene.com/api/library/football-stadium-f7b93967/download" --output assets/football-stadium.glb
          test "$(stat -c%s assets/football-stadium.glb)" -gt 1000000
          test "$(head -c 4 assets/football-stadium.glb)" = "glTF"
          curl --fail --location --retry 3 --retry-delay 2 --user-agent "PITCH-11-GitHub-Actions" "https://cdn.3dassets.dev/assets/19110/v1/model.glb" --output assets/team-dugout.glb
          test "$(stat -c%s assets/team-dugout.glb)" -gt 10000
          test "$(head -c 4 assets/team-dugout.glb)" = "glTF"
          curl --fail --location --retry 3 --retry-delay 2 --user-agent "PITCH-11-GitHub-Actions" "https://cdn.3dassets.dev/assets/19077/v1/model.glb" --output assets/corner-flag.glb
          test "$(stat -c%s assets/corner-flag.glb)" -gt 3000
          test "$(head -c 4 assets/corner-flag.glb)" = "glTF"
          mkdir -p assets/players
          # Use the committed canonical player model; do not overwrite it from an external URL.
          test -s assets/players/player.glb
          test "$(head -c 4 assets/players/player.glb)" = "glTF"
          curl --fail --location --retry 3 --retry-delay 2 --user-agent "PITCH-11-GitHub-Actions" "https://models.codelove.in/animations/m_idle_neutral_01.glb" --output assets/players/idle.glb
          curl --fail --location --retry 3 --retry-delay 2 --user-agent "PITCH-11-GitHub-Actions" "https://models.codelove.in/animations/m_walk_neutral_01.glb" --output assets/players/walk.glb
          curl --fail --location --retry 3 --retry-delay 2 --user-agent "PITCH-11-GitHub-Actions" "https://models.codelove.in/animations/m_run_neutral_01.glb" --output assets/players/run.glb
          for asset in assets/players/player.glb assets/players/idle.glb assets/players/walk.glb assets/players/run.glb; do
            test "$(stat -c%s "$asset")" -gt 1000
            test "$(head -c 4 "$asset")" = "glTF"
          done
          sha256sum assets/football-stadium.glb assets/team-dugout.glb assets/corner-flag.glb assets/players/idle.glb assets/players/walk.glb assets/players/run.glb | tee /tmp/pitch11-external-assets.sha256
          node scripts/validate-player-assets.mjs
          node scripts/inspect-player-fbx-package.mjs --compare-model
          node scripts/export-player-texture-audit.mjs /tmp/pitch11-player-texture-audit
      - name: Upload player texture audit (diagnostic only)
        uses: actions/upload-artifact@v4
        with:
          name: pitch11-player-texture-audit-${{ github.run_id }}
          path: /tmp/pitch11-player-texture-audit/
          if-no-files-found: error
          retention-days: 7
      - name: Build a mobile-optimized stadium model
        run: |
          npx --yes @gltf-transform/cli@4.5.1 resize assets/football-stadium.glb assets/football-stadium-mobile.glb --width 1024 --height 1024
          test -s assets/football-stadium-mobile.glb
          test "$(head -c 4 assets/football-stadium-mobile.glb)" = "glTF"
          test "$(stat -c%s assets/football-stadium-mobile.glb)" -lt "$(stat -c%s assets/football-stadium.glb)"
          echo "Desktop stadium: $(du -h assets/football-stadium.glb | cut -f1)"
          echo "Mobile stadium:  $(du -h assets/football-stadium-mobile.glb | cut -f1)"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
