# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser simulation module syntax
        run: |
          node --check engine/simulation.mjs
          node --check engine/simulation-lab.mjs
          node --check engine/pitch11-adapter.mjs
          node --check engine/broadcast-camera.mjs
          node --check engine/stadium-visibility.mjs
          node --check engine/stadium-model.mjs
          node --check engine/stadium-atmosphere.mjs
          node --check engine/goal-geometry.mjs
          node --check engine/player-animation-map.mjs
          node --check engine/player-animation.mjs
          node --check engine/league-soccer-ballphysics.mjs
          node --check stadium-runtime.js
      - name: Run simulation and adapter regression tests
        run: node --test engine/*.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Vendor pinned Three.js runtime for offline same-origin loading
        run: |
          mkdir -p /tmp/p11-three vendor
          npm pack three@0.170.0 --pack-destination /tmp/p11-three
          tar -xzf /tmp/p11-three/three-0.170.0.tgz -C vendor
          mv vendor/package vendor/three
          test -s vendor/three/build/three.module.js
          test -s vendor/three/examples/jsm/loaders/GLTFLoader.js
          test -s vendor/three/examples/jsm/utils/SkeletonUtils.js
          test -s vendor/three/LICENSE
      - name: Download and validate stadium assets into the Pages artifact
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 --retry-delay 2 --user-agent "PITCH-11-GitHub-Actions" "https://www.innerscene.com/api/library/football-stadium-f7b93967/download" --output assets/football-stadium.glb
          test "$(stat -c%s assets/football-stadium.glb)" -gt 1000000
          test "$(head -c 4 assets/football-stadium.glb)" = "glTF"
          curl --fail --location --retry 3 --retry-delay 2 --user-agent "PITCH-11-GitHub-Actions" "https://cdn.3dassets.dev/assets/19110/v1/model.glb" --output assets/team-dugout.glb
          test "$(stat -c%s assets/team-dugout.glb)" -gt 10000
          test "$(head -c 4 assets/team-dugout.glb)" = "glTF"
          curl --fail --location --retry 3 --retry-delay 2 --user-agent "PITCH-11-GitHub-Actions" "https://cdn.3dassets.dev/assets/19077/v1/model.glb" --output assets/corner-flag.glb
          test "$(stat -c%s assets/corner-flag.glb)" -gt 3000
          test "$(head -c 4 assets/corner-flag.glb)" = "glTF"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
