# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline application scripts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const html = fs.readFileSync('index.html', 'utf8');
          const tags = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          const inline = tags.filter(([, attrs, body]) =>
            !/\bsrc\s*=/.test(attrs) &&
            !/type=["'](?:importmap|application\/ld\+json)["']/i.test(attrs) &&
            body.trim()
          );
          if (!inline.length) throw new Error('No inline application scripts found');
          inline.forEach(([, attrs, body], i) => {
            const ext = /type=["']module["']/i.test(attrs) ? 'mjs' : 'cjs';
            const file = `/tmp/pitch11-inline-${i}.${ext}`;
            fs.writeFileSync(file, body);
            const result = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
            if (result.status !== 0) {
              process.stderr.write(result.stderr || result.stdout);
              process.exit(result.status || 1);
            }
          });
          console.log(`Checked ${inline.length} inline application scripts.`);
          NODE
      - name: Check browser simulation module syntax
        run: |
          node --check engine/law-compliance.js
          node --check engine/simulation.mjs
          node --check engine/simulation-lab.mjs
          node --check engine/pitch11-adapter.mjs
          node --check engine/broadcast-camera.mjs
          node --check engine/stadium-visibility.mjs
          node --check engine/stadium-model.mjs
          node --check engine/stadium-atmosphere.mjs
          node --check engine/goal-geometry.mjs
          node --check engine/player-animation-map.mjs
          node --check engine/player-animation.mjs
          node --check engine/player-model-state.mjs
          node --check engine/match-player-renderer.mjs
          node --check engine/player-renderer-performance.test.mjs
          node --check engine/league-soccer-ballphysics.mjs
          node --check stadium-runtime.js
      - name: Run simulation and adapter regression tests
        run: node --test engine/*.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Vendor pinned Three.js runtime for offline same-origin loading
        run: |
          mkdir -p /tmp/p11-three vendor
          npm pack three@0.170.0 --pack-destination /tmp/p11-three
          tar -xzf /tmp/p11-three/three-0.170.0.tgz -C vendor
          mv vendor/package vendor/three
          test -s vendor/three/build/three.module.js
          test -s vendor/three/examples/jsm/loaders/GLTFLoader.js
          test -s vendor/three/examples/jsm/utils/SkeletonUtils.js
          test -s vendor/three/LICENSE
      - name: Download and validate stadium assets into the Pages artifact
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 --retry-delay 2 --user-agent "PITCH-11-GitHub-Actions" "https://www.innerscene.com/api/library/football-stadium-f7b93967/download" --output assets/football-stadium.glb
          test "$(stat -c%s assets/football-stadium.glb)" -gt 1000000
          test "$(head -c 4 assets/football-stadium.glb)" = "glTF"
          curl --fail --location --retry 3 --retry-delay 2 --user-agent "PITCH-11-GitHub-Actions" "https://cdn.3dassets.dev/assets/19110/v1/model.glb" --output assets/team-dugout.glb
          test "$(stat -c%s assets/team-dugout.glb)" -gt 10000
          test "$(head -c 4 assets/team-dugout.glb)" = "glTF"
          curl --fail --location --retry 3 --retry-delay 2 --user-agent "PITCH-11-GitHub-Actions" "https://cdn.3dassets.dev/assets/19077/v1/model.glb" --output assets/corner-flag.glb
          test "$(stat -c%s assets/corner-flag.glb)" -gt 3000
          test "$(head -c 4 assets/corner-flag.glb)" = "glTF"
      - name: Build a mobile-optimized stadium model
        run: |
          npx --yes @gltf-transform/cli@4.5.1 resize assets/football-stadium.glb assets/football-stadium-mobile.glb --width 1024 --height 1024
          test -s assets/football-stadium-mobile.glb
          test "$(head -c 4 assets/football-stadium-mobile.glb)" = "glTF"
          test "$(stat -c%s assets/football-stadium-mobile.glb)" -lt "$(stat -c%s assets/football-stadium.glb)"
          echo "Desktop stadium: $(du -h assets/football-stadium.glb | cut -f1)"
          echo "Mobile stadium:  $(du -h assets/football-stadium-mobile.glb | cut -f1)"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
