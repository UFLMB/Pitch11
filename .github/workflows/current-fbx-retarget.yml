name: Current FBX retarget preflight

on:
  workflow_dispatch:
  push:
    branches: [test/current-fbx-retarget]
    paths:
      - "input/player-package/jog forward.fbx"
      - "assets/players/player.glb"
      - "scripts/retarget-preflight.py"
      - ".github/workflows/current-fbx-retarget.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender 4.5.3
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-4.5.3-linux-x64" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/blender-4.5.3-linux-x64/blender" --background --python-expr "import numpy; print('BLENDER_NUMPY_OK', numpy.__version__)"
      - name: Inspect source animation and target rig
        env:
          SOURCE_FBX: input/player-package/jog forward.fbx
          TARGET_GLB: assets/players/player.glb
        run: blender --background --python scripts/retarget-preflight.py
      - name: Verify preflight report
        run: |
          test -s retarget-preflight.json
          python3 -c "import json; d=json.load(open('retarget-preflight.json')); assert d['status'] == 'PREFLIGHT_ONLY_RETARGET_NOT_EXPORTED'; print('Report validated:', d['source_action'], d['direct_name_mapping_count'], 'mapped bones')"
      - name: Upload preflight report
        if: always() && hashFiles('retarget-preflight.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: current-fbx-retarget-preflight
          path: retarget-preflight.json
          retention-days: 14
